name: ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++
      - name: Build
        run: ninja
      - name: Unit tests
        run: ./build/test_core
      - name: Goal 1 smoke run (40 trials)
        run: ./build/malefly goal1 --trials 40 --probes 5 --out results/ci_goal1.json --csv results/ci_goal1.csv
